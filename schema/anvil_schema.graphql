type Mutation {
  """
  Create a `Cast` with the specified properties. This will require you to publish the `Cast`
  via the [`publishCast`]({{Mutations.publishCast}}) mutation before it will go live.
  """
  createCast(
    """
    Uses AI to help analyze the document's fields. Will implicitly set `detectFields` to `true`.
    """
    advancedDetectFields: Boolean = false
    allowedAliasIds: [String]

    """
    Uses AI to help detect the document's fields. Will implicitly set `detectFields` to `true`.
    """
    detectBoxesAdvanced: Boolean = false
    detectFields: Boolean = true
    file: Upload!
    isTemplate: Boolean = true
    organizationEid: String

    """
    The schema input, interpreted according to `schemaSource`:
    
    - `schemaSource: "json"` -- `schema` *is* your aliasIds, passed
      inline. This is the canonical way to supply your own custom field
      aliases. Accepts either the object form or the array shorthand. For
      example:
      ```
      schemaSource: "json"
      schema: { employeeName: { description: "The employee's full name" } }
      ```
      or
      ```
      schemaSource: "json"
      schema: ["employeeName", "employeeId"]
      ```
    
    - If `schemaSource` is an integration (currently only `"hubspot"`),
      `schema` tells us which object type(s) on that integration to build
      `aliasIds` from. We look up each object type's properties from the
      integration and normalize them into the `aliasIds` shape for you.
      How each aliasId is named depends on how many object types you pass:
      - One object type: the bare property name. For example,
        `schema: { objectTypes: ["contacts"] }` gives aliasIds like
        `firstname` and `email`.
      - More than one: `${objectType}.${propertyName}`, so properties two
        object types share stay separate. For example,
        `schema: { objectTypes: ["contacts", "companies"] }` gives
        aliasIds like `contacts.email`, `contacts.phone`, and
        `companies.phone`.
    
      Detected fields that match a property are tagged with its aliasId,
      so these are also the keys to use in `data` when filling the Cast.
    
    Requires `advancedDetectFields: true`.
    """
    schema: JSON

    """
    The source of the input schema (e.g. "json", "hubspot") used to create this cast. Pair it with `schema` (see below).
    """
    schemaSource: String
    title: String
  ): Cast

  """
  Create an e-signature packet. See the
  [Etch e-sign guide](/docs/api/e-signatures) for usage information.
  """
  createEtchPacket(
    """
    Uses AI to label uploaded documents, discover signers, and connect signers to fields.
    """
    advancedCreate: Boolean = false

    """
    When enabled, the EtchPacket payload can be updated. Requires a plan that allows EtchPacket updates.
    """
    allowUpdates: Boolean = false

    """Set to `true` to save uploaded PDFs to your PDF templates."""
    createCastTemplatesFromUploads: Boolean

    """
    Specifies data to fill documents in the `files` array. See the guide for details.
    """
    data: JSON

    """
    Uses AI to help detect fields on uploaded document. Will implicitly set `detectFields` to `true`.
    """
    detectBoxesAdvanced: Boolean = false

    """
    Set to `true` to duplicate all referenced PDF templates on packet
    creation. Setting to true is useful if you would like to edit the PDFs
    in the UI after packet creation.
    """
    duplicateCasts: Boolean = true

    """
    Enable all, none, or specific emails for this packet. When enabled, an
    email type will adhere to the organization settings for that email type.
    For example, when `signerViewAdmin` is enabled, an email will only be
    sent to organization members specified in the organization settings.
    
    Possible values: `true`, `false`, or an array of strings with any of
    the following `'signerViewAdmin'`, `'signerCompleteAdmin'`, or
    `'etchCompleteAdmin'`.
    
    The default is `false`.
    """
    enableEmails: JSON

    """
    When enabled, the signature certificate is withheld from what signers
    download (finish page, per-file download, and the combined zip). It is
    still generated, stored, and available to your organization's users.
    """
    excludeCertificateFromSignerDownloads: Boolean

    """
    Specifies files that will be in the resulting packet. See the guide for details.
    """
    files: [EtchFile!]

    """
    Allows customization and whitelabeling of the signer finish page. See the guide for details.
    """
    finishPageOptions: JSON

    """
    When set to `false`, the packet will immediately be sent to the first
    signer. When set to `true`, the resulting `EtchPacket` will not be
    immediately sent. You will need to send the packet via the UI or
    the [`sendEtchPacket`](#operation-sendetchpacket-Mutations) mutation.
    """
    isDraft: Boolean

    """
    When `true`, the resulting packet will be in test mode. You will not
    be charged for test packets. Test packets will not use valid signatures.
    Test packets only email verified members of your organization; sending
    one to any other email signer is refused.
    """
    isTest: Boolean

    """
    When enabled, merges all PDFs before users sign. All signers will sign
    one (potentially large) PDF.
    """
    mergePDFs: Boolean
    name: String
    organizationEid: String

    """
    Overrides the replyTo header on emails sent to signers.
    By default, this will be the support email listed in your organization settings.
    """
    replyToEmail: String

    """
    Overrides the replyTo header on emails sent to signers.
    By default, this will be your organization name.
    """
    replyToName: String

    """
    When `true`, every signer on the packet must have a signature or
    signature initial field assigned; sending a packet with a signer missing
    one throws an error. When omitted, falls back to the organization's
    `requireSignatures` config, then defaults to `false`. Pass `false`
    to explicitly override an organization that has the setting enabled.
    """
