name: Sync API Types

# Refreshes schema/ from the published @anvilco/types (the GraphQL schema and
# the OpenAPI spec, regenerated from production after every deploy by
# anvil-js's own sync), regenerates python_anvil/types, and opens one PR when
# any of it changed. Runs when anvil-js publishes a new @anvilco/types: its
# release workflow sends `anvilco-types-published` here. That dispatch is
# best-effort with no retry, so the weekly cron is a backstop for a dropped one.
# dotnet-anvil's sync-api-types.yml does the same.
#
# @anvilco/types takes a major bump when the API removes or changes a type,
# field or argument, a minor for additions and a patch for descriptions (its
# README has the policy). The generated types are this client's public API,
# so a sync of a major is a breaking change here too: the PR says so, its
# changelog note is marked BREAKING, it is labelled `breaking`, and the GitHub
# users in the SYNC_BREAKING_REVIEWERS repository variable (comma separated,
# optional) are asked to review. The bump comes with the dispatch; a cron or
# manual run reads it from the version recorded in schema/source.json.

on:
  repository_dispatch:
    types: [anvilco-types-published]
  schedule:
    - cron: '0 10 * * 1' # Every Monday at 10am UTC
  workflow_dispatch:

# BRANCH is force-pushed, so never let two runs race on it.
concurrency: sync-api-types

env:
  BRANCH: chore/sync-api-types
  SCHEMA_DIR: schema
  TYPES_DIR: python_anvil/types

jobs:
  sync-api-types:
    name: Sync API Types
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      # Always master, so a manual run from another branch can't put that
      # branch's commits in the PR. No persisted credentials: CI_GITHUB_TOKEN
      # is only handed to git and gh in the steps that push, not to the
      # install and the generators.
      - uses: actions/checkout@v7
        with:
          ref: master
          persist-credentials: false

      - run: pipx install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: 'poetry'

      - run: make install

      # One step, so the types are never regenerated from a spec that failed
      # to fetch, and a failed generation is discarded along with the specs.
      - name: Fetch the specs and generate the types
        id: generate
        continue-on-error: true
        run: |
          make update-schema
          make generate

      - name: Discard the output if that failed
        if: steps.generate.outcome != 'success'
        run: git checkout -- "$SCHEMA_DIR" "$TYPES_DIR"

      - name: Check for changes
        id: changes
        run: |
          echo "changed=$(git diff --quiet -- "$SCHEMA_DIR" "$TYPES_DIR" && echo false || echo true)" >> "$GITHUB_OUTPUT"
          git diff --stat

      - name: Open or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          TYPES_VERSION: ${{ github.event.client_payload.version }}
          TYPES_RELEASE_URL: ${{ github.event.client_payload.releaseUrl }}
          TYPES_BUMP: ${{ github.event.client_payload.bump }}
          REVIEWERS: ${{ vars.SYNC_BREAKING_REVIEWERS }}
        run: |
          # Not GITHUB_TOKEN: pushes and PRs made with it don't trigger
          # workflows, so the PR would never get its CI checks.
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # A deploy that didn't move the API again would otherwise force-push
          # an identical commit, re-running CI and discarding any edits made
          # on the branch.
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ] && git fetch -q --depth=1 origin "$BRANCH" && git diff --quiet FETCH_HEAD -- "$SCHEMA_DIR" "$TYPES_DIR"; then
            echo "PR #$PR already has this output"
            exit 0
          fi

          # Which @anvilco/types this is, and whether it was a major, minor or
          # patch: from the dispatch, or for a cron or manual run from the
          # version recorded in schema/source.json before and after the refresh.
          NEW_VERSION=$(python3 -c 'import json; print(json.load(open("schema/source.json"))["version"])')
          OLD_VERSION=$(git show HEAD:schema/source.json 2>/dev/null | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])' 2>/dev/null || true)
          TYPES_VERSION=${TYPES_VERSION:-$NEW_VERSION}
          TYPES_RELEASE_URL=${TYPES_RELEASE_URL:-https://github.com/anvilco/anvil-js/releases/tag/@anvilco/types@$TYPES_VERSION}
          if [ -z "$TYPES_BUMP" ]; then
            TYPES_BUMP=$(python3 - "$OLD_VERSION" "$NEW_VERSION" <<'PY'
          import re
          import sys

          def parse(version):
              return [int(part) for part in re.match(r"(\d+)\.(\d+)\.(\d+)", version).groups()]

          try:
              old, new = parse(sys.argv[1]), parse(sys.argv[2])
          except (AttributeError, TypeError):
              print("patch")  # no recorded version to compare with
          else:
              print("major" if new[0] != old[0] else "minor" if new[1] != old[1] else "patch")
          PY
            )
          fi
          echo "@anvilco/types@$TYPES_VERSION, a $TYPES_BUMP release"

          # Note the sync under Unreleased in the changelog, once per release.
          # BREAKING on a major, so the next release here is a major: the
          # generated types are public API, and the API removed or changed some.
          if [ "$TYPES_BUMP" = major ]; then
            NOTE="- BREAKING: Sync the generated API types in \`python_anvil.types\` with the production API, which removed or changed types or fields. Each one is listed in the [\`@anvilco/types@$TYPES_VERSION\` release notes]($TYPES_RELEASE_URL)."
          else
            NOTE="- Sync the generated API types in \`python_anvil.types\` with the production API."
          fi
          NOTE="$NOTE" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          note = os.environ["NOTE"]
          match = re.search(r"^## \[Unreleased\]\n(?P<body>.*?)(?=^## \[|\Z)", text, re.M | re.S)
          if match and note not in match["body"]:
              body = match["body"].rstrip("\n")
              section = f"{body}\n{note}\n\n" if body else f"\n{note}\n\n"
              text = text[: match.start("body")] + section + text[match.end("body") :]
              path.write_text(text, encoding="utf-8")
          PY

          if [ "$EVENT_NAME" = repository_dispatch ]; then
            TRIGGER="the release of \`@anvilco/types@$TYPES_VERSION\` ($TYPES_RELEASE_URL)."
          else
            TRIGGER="a \`$EVENT_NAME\` run."
          fi
          {
            echo "Automated sync of the generated types from the published \`@anvilco/types\`, which carries the production API's specs. Triggered by $TRIGGER"
            echo
            echo "- \`$SCHEMA_DIR/\`: the GraphQL schema and the OpenAPI spec, from the package"
            echo "- \`$TYPES_DIR/\`: regenerated from them with \`make generate\`"
            echo
            case "$TYPES_BUMP" in
              major)
                echo "**\`@anvilco/types@$TYPES_VERSION\` is a major release: the API removed or changed types or fields, listed in its [release notes]($TYPES_RELEASE_URL).** The generated types are this client's public API, so the changelog note is marked BREAKING and the next release must be a major. Review each change before merging."
                ;;
              minor)
                echo "\`@anvilco/types@$TYPES_VERSION\` is a minor release: the API gained types, fields or values. The next release here is at least a minor."
                ;;
              *)
                echo "\`@anvilco/types@$TYPES_VERSION\` is a patch release: only descriptions changed."
                ;;
            esac
            echo
            echo "A later deploy that changes these files again rebuilds this branch from \`master\`, replacing any edits made here."
          } > "$RUNNER_TEMP/pr-body.md"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A -- "$SCHEMA_DIR" "$TYPES_DIR" CHANGELOG.md
          git commit -m "Sync the generated API types from production"
          git push --force origin "$BRANCH"

          TITLE="Sync the generated API types from production"
          if [ "$TYPES_BUMP" = major ]; then
            TITLE="$TITLE (breaking API changes)"
          fi
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            gh pr create \
              --title "$TITLE" \
              --body-file "$RUNNER_TEMP/pr-body.md" \
              --base master \
              --head "$BRANCH"
            PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          fi

          # A breaking release can't merge as routine: flag it and ask for review.
          if [ "$TYPES_BUMP" = major ]; then
            gh label create breaking --color B60205 --description "Removes or changes part of the public API" --force >/dev/null 2>&1 || true
            gh pr edit "$PR" --add-label breaking || echo "::warning::Could not label PR #$PR as breaking"
            if [ -n "$REVIEWERS" ]; then
              gh pr edit "$PR" --add-reviewer "$(printf '%s' "$REVIEWERS" | tr -d ' ')" || echo "::warning::Could not request review of PR #$PR from $REVIEWERS"
            fi
          fi

      # Production moved back to match master (e.g. a rollback before the PR
      # merged), so an open sync PR is now wrong.
      - name: Close stale PR
        if: steps.changes.outputs.changed == 'false' && steps.generate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.CI_GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR" ]; then
            gh pr close "$PR" --delete-branch --comment "Production now matches master, so this sync is no longer needed."
          fi

      - name: Fail if the generator failed
        if: steps.generate.outcome != 'success'
        run: |
          echo "::error::Fetching the specs or generating the types failed. See the step above."
          exit 1
